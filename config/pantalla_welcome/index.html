<body ng-app="personalizacionWichi" ng-controller="wichiController">
  <div class="container">
    <div class="row">
      <div class="col-xs-12">
        <div class="ccp-header">
          <h1>Actualizaciones de datos de cada sistema</h1>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xs-12">
        <div class="home-slideshow">
          <div class="row">
	    <div class="col-xs-9">
              <div class="sub-header">
                <b>Sistema</b>
              </div>
            </div>
            <div class="col-xs-3">
              <div class="sub-header">
                <b>Actualización</b>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="themed-grid-col col-xs-12">
        <div class="main-menu">
          <div class="row" ng-repeat="(key, sistema) in actualizaciones" 
                style="padding:10px; border-bottom: 1px solid grey;">
            <div class="col-xs-3">
              <img ng-if="imagenesSIU[key].length != 0  && sistema[3] == 'SIU-Guarani'"
                	ng-src="{{imagenesSIU[0]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Mapuche'"
                	ng-src="{{imagenesSIU[1]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Pilaga'"
                	ng-src="{{imagenesSIU[2]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Araucano'"
                	ng-src="{{imagenesSIU[3]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Querandies'"
                	ng-src="{{imagenesSIU[4]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'RHUN-SPU'"
                	ng-src="{{imagenesSIU[5]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Diaguita'"
                	ng-src="{{imagenesSIU[6]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Kolla'"
                	ng-src="{{imagenesSIU[7]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Guarani3'"
                	ng-src="{{imagenesSIU[8]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Preinscripciones'"
                	ng-src="{{imagenesSIU[9]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'SIU-Sanavirón/Quilmes'"
                	ng-src="{{imagenesSIU[10]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'Sudocu'"
                	ng-src="{{imagenesSIU[11]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;"> 

              <img ng-if="imagenesSIU[key].length != 0 && sistema[3] == 'Moodle'"
                	ng-src="{{imagenesSIU[12]}}"
                	alt="{{sistema.sistema}}" 
                        style="width:150px; height:34px;">                    
              <span ng-if="imagenesSIU[sistema.instalacion_id - 1].length == 0">
            </div>
            <div class="col-xs-6">
              {{sistema[2]}}
            </div>
            <div class="col-xs-3">
              {{sistema[1]}} hs
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="../../../../plugin/pentaho-cdf/api/resources/js/compressed/lib/modernizr/modernizr-2.8.3.js" charset="utf-8"></script>
  <script src="../../../../content/common-ui/resources/web/compressed/jquery/jquery.js" charset="utf-8"></script>
  <script src="js/vendor/owl.carousel.min.js" charset="utf-8"></script>
  <script src="js/main.js" charset="utf-8"></script>
  <script>
    $(document).ready(function() {

      // shuffle the slider 'cards'
      var parent = $("#home-slideshow");
      var divs = parent.children();
      while (divs.length) {
        parent.append(divs.splice(Math.floor(Math.random() * divs.length), 1)[0]);
      }

      $("#home-slideshow").owlCarousel({
        navigation: false,
        slideSpeed: 300,
        paginationSpeed: 400,
        singleItem: true,
        autoPlay: 30000,
        mouseDrag: false,
        transitionStyle: "fade"
      });
    });
  </script>

  <script src="js/vendor/angular.min.js"></script>
  <script src="js/main_wichi.js"></script>

</body>
</html>
